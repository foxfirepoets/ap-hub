# CHUNK_1_SHELL — packaging. Signing and clean-machine certification land in CHUNK_9.
#
# Both platforms install per-user and NON-ELEVATED: the spec's first acceptance criterion is a
# standard non-admin user double-clicking one file. `perMachine: false` and an install root
# under the user's own profile are what make that true — a machine-wide install would prompt
# for administrator rights and fail the criterion outright.
#
# Signing identities are referenced by NAME from the build machine's environment and are never
# committed. An unsigned build is a development artifact, not a shippable installer.

appId: com.aphub.desktop
productName: BookScout OS
copyright: BookScout OS

directories:
  output: release
  buildResources: desktop/assets

# Only what the shell needs at runtime. The BookScout OS source tree is bundled into
# `dist-desktop/main.mjs` by esbuild; `out/` is the statically exported React tree the window
# loads off disk (CHUNK_3 — `npm run web:build` must have run before packaging).
#
# `node_modules` is listed EXPLICITLY. The main bundle leaves third-party packages external
# (see scripts/build-desktop.mjs — bundling CommonJS into ESM breaks `require`), so `pg` and
# its dependencies must be present in the installed app or the database never opens.
# electron-builder prunes this to production dependencies at pack time.
files:
  - dist-desktop/**/*
  - out/**/*
  - node_modules/**/*
  - package.json

# CHUNK_2_DATABASE. These must stay OUTSIDE the asar archive:
#   pgsql   — `initdb` and `postgres` are executed as child processes, and Windows cannot
#             execute a file that only exists inside an asar.
#   migrations — read as real files at launch by the migration runner.
# Rebuild `vendor/pgsql` with `node scripts/bundle-postgres.mjs` before packaging; the
# expected tree fingerprint is pinned in `vendor/postgres.lock.json`.
extraResources:
  - from: vendor/pgsql
    to: pgsql
  - from: migrations
    to: migrations

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  # Authenticode. Resolved from the build machine's secret store at pack time, never here.
  # signtoolOptions:
  #   certificateSubjectName: ${env.APHUB_WIN_CERT_SUBJECT}

nsis:
  oneClick: false
  perMachine: false          # per-user install → no administrator prompt
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BookScout OS
  # CHUNK_9 replaces this with the explicit "what should happen to your information?" choice.
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.finance
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.plist
  # Developer ID + notarization are supplied by the build machine in CHUNK_9:
  #   CSC_NAME, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
  notarize: false

dmg:
  writeUpdateInfo: false

# No auto-update in P1. Update delivery is manual (download the next signed installer and run
# it); automatic checking against a static signed manifest is designed in packet §8 and built
# in P4. Nothing here forecloses it.
publish: null
