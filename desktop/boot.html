<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AP-Hub</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #fbfbfd;
        color: #1d1d1f;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #16161a; color: #f2f2f5; }
        .detail { color: #a0a0aa !important; }
      }
      main { text-align: center; max-width: 30rem; padding: 2rem; }
      h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.75rem; }
      .detail { color: #6b6b73; font-size: 0.975rem; line-height: 1.5; margin: 0; }
      .bar {
        margin: 1.75rem auto 0;
        width: 12rem;
        height: 4px;
        border-radius: 2px;
        background: rgba(128, 128, 140, 0.25);
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #3b7ddd;
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="boot-heading" aria-live="polite">AP-Hub is starting up.</h1>
      <p id="boot-detail" class="detail" aria-live="polite">
        This only takes a moment the first time. Your information is safe.
      </p>
      <div id="boot-bar" class="bar" role="progressbar" aria-label="AP-Hub is starting up"></div>
    </main>
    <!-- External file, not inline: the renderer CSP is `script-src 'self'`. -->
    <script src="boot.js"></script>
  </body>
</html>
